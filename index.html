import React, { useState, useEffect } from 'react';
import { 
  Menu, X, Target, Lightbulb, Award, Gift, 
  CheckCircle2, ChevronDown, ChevronUp, MapPin, 
  Calendar, Clock, Video, Sparkles, Layout, BookOpen, Bot
} from 'lucide-react';

// --- INJECT GOOGLE FONTS ---
const FontStyles = () => (
  <style dangerouslySetInnerHTML={{__html: `
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap');
    
    .font-heading {
      font-family: 'Montserrat', sans-serif;
    }
    .font-body {
      font-family: 'Roboto', sans-serif;
    }
    html {
      scroll-behavior: smooth;
    }
  `}} />
);

// --- COMPONENTS ---

// 1. Navigation
const Navigation = () => {
  const [isOpen, setIsOpen] = useState(false);
  const [isScrolled, setIsScrolled] = useState(false);

  useEffect(() => {
    const handleScroll = () => {
      setIsScrolled(window.scrollY > 10);
    };
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const navLinks = [
    { name: 'Giới thiệu', href: '#gioi-thieu' },
    { name: 'Chương trình', href: '#chuong-trinh' },
    { name: 'Quyền lợi', href: '#quyen-loi' },
    { name: 'Tổ chức', href: '#to-chuc' },
  ];

  return (
    <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-white shadow-md py-3' : 'bg-white py-5'}`}>
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex justify-between items-center">
          {/* Logo */}
          <div className="flex-shrink-0 flex items-center">
            <span className="font-heading font-bold text-2xl text-[#EE0033] tracking-tight">
              VIETTEL<span className="text-[#0A0A0A]">NETWORKS</span>
            </span>
          </div>

          {/* Desktop Menu */}
          <div className="hidden md:flex space-x-8 items-center">
            {navLinks.map((link) => (
              <a key={link.name} href={link.href} className="text-[#4B4B4B] hover:text-[#EE0033] font-body font-medium transition-colors">
                {link.name}
              </a>
            ))}
            <a href="#dang-ky" className="bg-[#EE0033] hover:bg-[#CC0029] text-white px-6 py-2.5 rounded-[4px] font-body font-medium transition-colors">
              ĐĂNG KÝ NGAY
            </a>
          </div>

          {/* Mobile menu button */}
          <div className="md:hidden flex items-center">
            <button onClick={() => setIsOpen(!isOpen)} className="text-[#0A0A0A] hover:text-[#EE0033]">
              {isOpen ? <X size={28} /> : <Menu size={28} />}
            </button>
          </div>
        </div>
      </div>

      {/* Mobile Menu */}
      {isOpen && (
        <div className="md:hidden bg-white border-t border-[#E5E5E5] shadow-lg absolute w-full">
          <div className="px-4 pt-2 pb-6 space-y-1">
            {navLinks.map((link) => (
              <a 
                key={link.name} 
                href={link.href}
                onClick={() => setIsOpen(false)}
                className="block px-3 py-3 text-base font-medium text-[#4B4B4B] hover:text-[#EE0033] hover:bg-[#F9F9F9] rounded-md font-body"
              >
                {link.name}
              </a>
            ))}
            <div className="pt-4 px-3">
              <a 
                href="#dang-ky"
                onClick={() => setIsOpen(false)}
                className="block w-full text-center bg-[#EE0033] hover:bg-[#CC0029] text-white px-6 py-3 rounded-[4px] font-body font-medium"
              >
                ĐĂNG KÝ NGAY
              </a>
            </div>
          </div>
        </div>
      )}
    </nav>
  );
};

// 8. FAQ Section
const FaqItem = ({ question, answer }) => {
  const [isOpen, setIsOpen] = useState(false);

  return (
    <div className="border border-[#E5E5E5] rounded-lg mb-4 overflow-hidden bg-white">
      <button 
        className="w-full flex justify-between items-center p-5 text-left bg-white hover:bg-[#F9F9F9] transition-colors"
        onClick={() => setIsOpen(!isOpen)}
      >
        <span className="font-heading font-bold text-lg text-[#0A0A0A] pr-4">{question}</span>
        {isOpen ? <ChevronUp className="w-5 h-5 text-[#EE0033]" /> : <ChevronDown className="w-5 h-5 text-[#4B4B4B]" />}
      </button>
      {isOpen && (
        <div className="p-5 pt-0 text-[#4B4B4B] font-body bg-white border-t border-[#E5E5E5]">
          {answer}
        </div>
      )}
    </div>
  );
};

const FaqSection = () => {
  const faqs = [
    {
      q: "Tôi chưa từng sử dụng các công cụ AI thì có theo kịp chương trình không?",
      a: "Hoàn toàn có thể. Khóa học có phần cơ bản thiết kế từ con số 0 kèm bộ tài liệu cầm tay chỉ việc, giúp bạn làm quen và thực hành ngay trong khóa học."
    },
    {
      q: "Tôi có bắt buộc phải mua tài khoản AI trả phí không?",
      a: "Không bắt buộc. Bạn có thể dùng bản miễn phí, nhưng BTC khuyến khích bản trả phí (như ChatGPT Plus, Claude Pro, Canva Pro) để trải nghiệm tối đa sức mạnh của AI trong công việc."
    },
